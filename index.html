<!DOCTYPE html>

<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Rhythm</title>

```
<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

<!-- ========================= -->

<!-- 開始畫面 -->
<div id="start-screen">

    <h1 class="game-title">
        PIXEL RHYTHM
    </h1>

    <button id="menu-start-btn" onclick="startGame()">
        START GAME
    </button>

</div>

<div id="game-container">
<!-- ========================= -->

<div id="start-screen">

```
<h1>PIXEL RHYTHM</h1>

<button id="menu-start-btn">
    START GAME
</button>
```

</div>

<!-- ========================= -->

<!-- 遊戲主畫面 -->

<!-- ========================= -->

<div id="game-container">

```
<div id="hud">

    <div class="stat">
        SCORE:
        <span id="score">0</span>
    </div>

    <div class="stat">
        COMBO:
        <span id="combo">0</span>
    </div>

    <div class="stat">
        ACC:
        <span id="acc">100.00%</span>
    </div>

</div>

<!-- ========================= -->
<!-- Live2D角色區 -->
<!-- ========================= -->

<div id="character-area">

    <img
        id="game-character"
        src="assets/character/idle/1.png"
        alt="character">

</div>

<!-- ========================= -->
<!-- 遊戲區 -->
<!-- ========================= -->

<div id="game-canvas">

    <div id="lane-container">

        <div class="lane" data-key="D"></div>

        <div class="lane" data-key="F"></div>

        <div class="lane" data-key="J"></div>

        <div class="lane" data-key="K"></div>

    </div>

    <div id="judge-line"></div>

    <div id="hit-feedback"></div>

</div>
```

</div>

<!-- ========================= -->

<!-- 結算畫面 -->

<!-- ========================= -->

<div id="result-screen">

```
<h2>RESULT</h2>

<div id="result-score">
    SCORE: 0
</div>

<div id="result-acc">
    ACC: 100%
</div>

<button onclick="location.reload()">
    RESTART
</button>
```

</div>

<audio
 id="bgm"
 src="assets/music/song1.mp3"> </audio>

<script src="js/game.js"></script>

</body>
</html>
